<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&amp;display=swap');
    </style>
  </defs>
  <rect width="520" height="90" fill="#ffffff"/>

  <!-- Logo circular botánico -->
  <g transform="translate(4, 8)">
    <!-- Círculo exterior teal -->
    <circle cx="36" cy="36" r="33" stroke="#3D5A5C" stroke-width="2.2" fill="none" opacity="0.9"/>
    <!-- Arco izquierdo rose gold -->
    <path d="M36 12 C25.5 15,16.5 24,15 36 C13.5 48,21 58.5,30 63" stroke="#C4857A" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Arco derecho rose gold -->
    <path d="M36 12 C46.5 15,55.5 24,57 36 C58.5 48,51 58.5,42 63" stroke="#C4857A" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Hoja izquierda -->
    <ellipse cx="12" cy="30" rx="7.5" ry="3.75" fill="#3D5A5C" opacity="0.8" transform="rotate(-30 12 30)"/>
    <!-- Hoja derecha -->
    <ellipse cx="60" cy="30" rx="7.5" ry="3.75" fill="#3D5A5C" opacity="0.8" transform="rotate(30 60 30)"/>
    <!-- Hoja superior izquierda -->
    <ellipse cx="19.5" cy="15" rx="6" ry="3" fill="#3D5A5C" opacity="0.7" transform="rotate(-50 19.5 15)"/>
    <!-- Hoja superior derecha -->
    <ellipse cx="52.5" cy="15" rx="6" ry="3" fill="#3D5A5C" opacity="0.7" transform="rotate(50 52.5 15)"/>
    <!-- Gota central -->
    <path d="M36 21 C31.5 28.5,25.5 34.5,25.5 40.5 C25.5 46.5,30 51,36 51 C42 51,46.5 46.5,46.5 40.5 C46.5 34.5,40.5 28.5,36 21Z"
      fill="#C4857A" fill-opacity="0.25" stroke="#C4857A" stroke-width="1.5"/>
    <!-- Brillo gota -->
    <path d="M33 28.5 C30 33,28.5 37.5,29.25 40.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Texto principal -->
  <text x="90" y="48" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="300" fill="#C4857A" letter-spacing="0.8">esencia</text>
  <text x="253" y="48" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="700" font-style="italic" fill="#8B4A3F">de</text>
  <text x="290" y="48" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="300" fill="#C4857A" letter-spacing="0.8">belleza.es</text>

  <!-- Subtítulo -->
  <text x="90" y="70" font-family="Raleway, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="300" fill="#C4857A" letter-spacing="3" opacity="0.85">Peluquería • Estética • Perfumes</text>
</svg>